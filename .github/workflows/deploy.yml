# main에 합치면 이미지를 만들어 수업 EKS p2-1의 dmin-front를 교체한다.
# 수업 AWS는 GitHub OIDC(gha-p2-1)로만, 캠퍼스 IP에서만 들어갈 수 있어 캠퍼스 PC의 self-hosted runner에서 돈다.
# GitHub Pages 배포(pages.yml)는 그대로 둔다.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dmin-front
  cancel-in-progress: false

env:
  SERVICE: dmin-front
  NAMESPACE: p2-1

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::881490135253:role/gha-p2-1
          aws-region: ap-northeast-2

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push (linux/amd64)
        run: |
          set -euo pipefail
          IMAGE="${{ steps.ecr.outputs.registry }}/teams/p2-1/app:${SERVICE}-${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          # 태그는 덮어쓸 수 없다. 같은 커밋을 다시 돌리면 이미 올린 이미지를 그대로 쓴다.
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "already pushed: $IMAGE"
            exit 0
          fi
          # 클러스터 노드는 x86이다. Apple Silicon runner에서도 amd64로 만든다.
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Roll out
        env:
          # runner PC의 ~/.kube/config(로컬 kind 등)를 건드리지 않도록 임시 파일을 쓴다.
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name skala-2026 --region ap-northeast-2 --kubeconfig "$KUBECONFIG"
          kubectl -n "$NAMESPACE" set image "deployment/$SERVICE" "$SERVICE=$IMAGE"
          kubectl -n "$NAMESPACE" rollout status "deployment/$SERVICE" --timeout=10m
